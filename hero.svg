<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Juan Carlos Ayala — Head of Engineering at Porteria®">
  <defs>
    
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#1e2635" stroke-width="1" opacity="0.55"/>
  </pattern>
    <radialGradient id="glowA" cx="0.15" cy="0.1" r="0.7"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx="0.9" cy="0.9" r="0.6"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.25"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <linearGradient id="name" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="0.55" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <clipPath id="card"><rect width="1000" height="300" rx="18"/></clipPath>
  </defs>
  <style>
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .rise { animation: rise .8s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .wave { transform-origin: 2px 60px; animation: wave 3.2s ease-in-out infinite; }
    @keyframes wave { 0%,100% { transform: skewY(0deg) scaleX(1); } 50% { transform: skewY(-3deg) scaleX(.96); } }
    .scan { animation: scan 6s linear infinite; }
    @keyframes scan { from { transform: translateY(-40px); } to { transform: translateY(340px); } }
  </style>
  <g clip-path="url(#card)">
    <rect width="1000" height="300" fill="#0b0f17"/>
    <rect width="1000" height="300" fill="url(#grid)"/>
    <rect width="1000" height="300" fill="url(#glowA)"/>
    <rect width="1000" height="300" fill="url(#glowB)"/>
    <rect class="scan" width="1000" height="40" fill="#22d3ee" opacity="0.04"/>
  </g>
  <rect x="0.5" y="0.5" width="999" height="299" rx="18" fill="none" stroke="#1e2635"/>

  <g class="rise" style="animation-delay:.05s">
    <text x="48" y="62" class="mono" font-size="15" fill="#22d3ee">~/d3vaya <tspan fill="#8b98a9">$ whoami</tspan></text>
  </g>
  <g class="rise" style="animation-delay:.25s">
    <text x="46" y="122" class="sans" font-size="54" font-weight="800" letter-spacing="-1.5" fill="url(#name)">Juan Carlos Ayala</text>
  </g>
  <g class="rise" style="animation-delay:.45s">
    <text x="48" y="162" class="mono" font-size="20" fill="#e6edf3">Head of Engineering <tspan fill="#8b98a9">@</tspan> <tspan fill="#a78bfa" font-weight="700">Porteria®</tspan><tspan class="cursor" fill="#22d3ee"> ▍</tspan></text>
  </g>
  <g class="rise" style="animation-delay:.6s">
    <text x="48" y="192" class="mono" font-size="14" fill="#8b98a9">Santiago, Chile · since 2014 · TypeScript · Elixir</text>
  </g>

  
  <g class="rise" style="animation-delay:0.8s" transform="translate(48 218)">
    <rect width="184" height="54" rx="10" fill="#0f1520" stroke="#1e2635"/>
    <text x="14" y="25" class="mono" font-size="18" font-weight="700" fill="#e6edf3">12+ yrs</text>
    <text x="14" y="43" class="mono" font-size="11" fill="#8b98a9">shipping software</text>
  </g>
  <g class="rise" style="animation-delay:0.9500000000000001s" transform="translate(248 218)">
    <rect width="184" height="54" rx="10" fill="#0f1520" stroke="#1e2635"/>
    <text x="14" y="25" class="mono" font-size="18" font-weight="700" fill="#22d3ee">2,181</text>
    <text x="14" y="43" class="mono" font-size="11" fill="#8b98a9">contributions in 2026</text>
  </g>
  <g class="rise" style="animation-delay:1.1s" transform="translate(448 218)">
    <rect width="184" height="54" rx="10" fill="#0f1520" stroke="#1e2635"/>
    <text x="14" y="25" class="mono" font-size="18" font-weight="700" fill="#e6edf3">183</text>
    <text x="14" y="43" class="mono" font-size="11" fill="#8b98a9">active days in 2026</text>
  </g>

  
  <g transform="translate(770 58) scale(0.95)">
    <rect x="-4" y="-10" width="6" height="190" rx="3" fill="#94a3b8"/>
    <circle cx="-1" cy="-12" r="7" fill="#e2e8f0"/>
    <g class="wave">
      <clipPath id="pen"><path d="M2 0 L182 60 L2 120 Z"/></clipPath>
      <g clip-path="url(#pen)">
        <rect x="2" y="0" width="190" height="60" fill="#f8fafc"/>
        <rect x="2" y="60" width="190" height="60" fill="#ef4444"/>
        <rect x="2" y="0" width="60" height="60" fill="#2563eb"/>
        <path transform="translate(32 30) scale(1.25)" fill="#fff"
          d="M0,-14 L3.3,-4.5 L13.3,-4.3 L5.3,1.7 L8.2,11.3 L0,5.6 L-8.2,11.3 L-5.3,1.7 L-13.3,-4.3 L-3.3,-4.5 Z"/>
      </g>
      <path d="M2 0 L182 60 L2 120 Z" fill="none" stroke="#00000033" stroke-width="2"/>
    </g>
  </g>
</svg>